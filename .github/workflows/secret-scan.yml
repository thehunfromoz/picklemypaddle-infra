# Reusable: gitleaks scan of the full git history (SCRUM-14/18).
#   jobs:
#     secrets:
#       uses: thehunfromoz/picklemypaddle-infra/.github/workflows/secret-scan.yml@main
name: Secret scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
