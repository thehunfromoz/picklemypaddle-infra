# Checks every pull request and push to main for the infra repo.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    uses: ./.github/workflows/secret-scan.yml

  workflows:
    name: Lint GitHub workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint (also shellchecks run blocks)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest \
            -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}%0A{{end}}'

  lint:
    name: Lint scripts and compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck staging/*.sh production/*.sh tests/*.sh
      # SCRUM-38. Kept in this job so the required check names don't change.
      - name: Tailscale Serve config checks (unit)
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
      - name: install.sh --tailscale / --tailscale-off (stand-in tailscale)
        run: bash tests/tailscale.test.sh
      - name: Compose file is valid
        run: |
          cp staging/.env.example staging/.env
          touch /tmp/integrations.env /tmp/editor.env
          sed -i 's|^INTEGRATIONS_ENV_FILE=.*|INTEGRATIONS_ENV_FILE=/tmp/integrations.env|' staging/.env
          sed -i 's|^EDITOR_ENV_FILE=.*|EDITOR_ENV_FILE=/tmp/editor.env|' staging/.env
          docker compose -f staging/compose.staging.yml --project-directory staging config -q
          # Updater targets: exactly the labelled services
          test "$(STACK_DIR=$PWD/staging bash -c 'source <(sed -n "/^compose()/,/^}/p;/^autoupdate_services()/,/^}/p" staging/update.sh); autoupdate_services' | sort | xargs)" = "editor integrations site"
          # SCRUM-34: the editor's gateway listener is published on loopback only, never on the LAN.
          ports="$(docker compose -f staging/compose.staging.yml --project-directory staging config --format json | jq -c '[.services.gateway.ports[] | select(.target == 8081)]')"
          if [ "$(jq -r '.[0].host_ip' <<<"$ports")" != 127.0.0.1 ] || [ "$(jq length <<<"$ports")" != 1 ]; then
            echo "::error::the editor listener (gateway :8081) must be published on 127.0.0.1 only: $ports"; exit 1
          fi
          # The production stack never has the editor.
          if grep -rqiE 'keystatic|site-editor|editor\.env' production; then
            echo "::error::production/ must not run the blog editor (SCRUM-34)"; exit 1
          fi
      # SCRUM-19. Kept in this job so the required check names don't change.
      - name: Production compose file and gateway Caddyfile are valid
        run: |
          cp production/.env.example production/.env
          docker compose -f production/compose.production.yml --project-directory production config -q
          # The gateway config is the Caddyfile plus one file per website (gateway/sites/*.caddy).
          # Validate it as the container sees it: once with the defaults, once with a realistic
          # domain and a quoted HSTS value, and once with the new-site template switched on.
          gateway="$PWD/production/gateway"
          check() { # check <title> <sites dir> [docker -e options...]
            local title="$1" sites="$2"; shift 2
            if ! out="$(docker run --rm "$@" -v "$gateway/Caddyfile:/etc/caddy/Caddyfile:ro" \
              -v "$sites:/etc/caddy/sites:ro" caddy:2-alpine \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile 2>&1)"; then
              echo "::error title=production Caddyfile ($title)::${out//$'\n'/%0A}"; exit 1
            fi
          }
          check defaults "$gateway/sites"
          check "example.com, HSTS" "$gateway/sites" -e SITE_DOMAIN=example.com -e 'HSTS=max-age=31536000; includeSubDomains'
          tmp="$(mktemp -d)"
          cp "$gateway"/sites/*.caddy "$tmp/"
          cp "$gateway/sites/new-site.caddy.example" "$tmp/new-site.caddy"
          check "with the new-site template" "$tmp"
      - name: Production never updates itself (no timer, no auto-update label)
        run: |
          if [ -e production/systemd ]; then
            echo "::error::production/ must not have an updater timer: releases are deployed by hand (update.sh)"; exit 1
          fi
          if grep -rq 'com.picklemypaddle.autoupdate' production; then
            echo "::error::production services must not carry the auto-update label"; exit 1
          fi
      - name: systemd units are valid
        run: |
          sudo mkdir -p /opt/picklemypaddle/staging
          sudo install -m 0755 staging/update.sh /opt/picklemypaddle/staging/update.sh
          systemd-analyze verify staging/systemd/pmp-staging-update.service staging/systemd/pmp-staging-update.timer

  updater:
    name: Updater deploys, rolls back and recovers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/staging-update.test.sh
      # SCRUM-19: production install, manual deploys and rollbacks. Kept in this job so the
      # required check names don't change.
      - name: Production install, deploy and rollback (SCRUM-19)
        run: bash tests/production-update.test.sh
      - name: Diagnostics on failure
        if: failure()
        run: |
          out="$(docker ps -a --format '{{.Names}} {{.Status}}'; for c in $(docker ps -aq); do echo "--- $(docker inspect -f '{{.Name}}' "$c")"; docker logs --tail 15 "$c" 2>&1; done)"
          echo "::error title=containers::${out//$'\n'/%0A}"

  site-image:
    name: Real site image runs behind the gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull :staging images anonymously (as home-server will)
        run: |
          docker pull ghcr.io/thehunfromoz/picklemypaddle-site-editor:staging || {
            echo "::error::Can't pull the blog editor image without logging in. Merge picklemypaddle-site #41 first, then make the picklemypaddle-site-editor GHCR package public."; exit 1; }
          docker pull ghcr.io/thehunfromoz/picklemypaddle-integrations:staging || {
            echo "::error::Can't pull the integrations image without logging in. Merge picklemypaddle-integrations #1 first, and make sure the GHCR package is public."; exit 1; }
          if ! docker pull ghcr.io/thehunfromoz/picklemypaddle-site:staging; then
            echo "::error::Can't pull the site image without logging in. Make the GHCR package public (see runbooks/staging-home-server.md, step 1)."
            exit 1
          fi
      - name: Start the staging stack
        run: |
          cp staging/.env.example staging/.env
          sed -i 's/^STAGING_BIND=.*/STAGING_BIND=127.0.0.1/' staging/.env
          touch /tmp/integrations.env
          sed -i 's|^INTEGRATIONS_ENV_FILE=.*|INTEGRATIONS_ENV_FILE=/tmp/integrations.env|' staging/.env
          # Dummy GitHub App values: enough to start the editor and check its sign-in redirect.
          printf 'KEYSTATIC_GITHUB_CLIENT_ID=Iv1.citestclient\nKEYSTATIC_GITHUB_CLIENT_SECRET=%s\nKEYSTATIC_SECRET=%s\n' \
            "$(openssl rand -hex 20)" "$(openssl rand -hex 32)" >/tmp/editor.env
          sed -i 's|^EDITOR_ENV_FILE=.*|EDITOR_ENV_FILE=/tmp/editor.env|' staging/.env
          docker compose -f staging/compose.staging.yml --project-directory staging up -d --wait --wait-timeout 120
      - name: Site answers through the gateway with its security headers
        run: |
          curl -fsS http://127.0.0.1:8088/healthz
          curl -fsS http://127.0.0.1:8088/ | grep -q 'PickleMyPaddle'
          headers="$(curl -fsSI http://127.0.0.1:8088/)"
          echo "$headers"
          grep -qi "^content-security-policy: default-src 'self'" <<<"$headers"
          grep -qi '^x-frame-options: DENY' <<<"$headers"
          if grep -qi '^server:' <<<"$headers"; then echo "Server header leaked"; exit 1; fi
          # Staging-only (SCRUM-38): noindex everywhere, disallow-all robots.txt, Preview ribbon CSS
          grep -qi '^x-robots-tag: noindex' <<<"$headers"
          curl -fsS http://127.0.0.1:8088/robots.txt | grep -qx 'Disallow: /'
          curl -fsSI http://127.0.0.1:8088/env.css | grep -qi '^content-type: text/css'
          curl -fsS http://127.0.0.1:8088/env.css | grep -q 'data-env="staging-only"\]\[hidden\]'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/no-such-page)" = 404
      - name: Integrations answers on /api through the gateway, as staging
        run: |
          out="$(curl -fsS http://127.0.0.1:8088/api/status)"
          echo "$out"
          grep -q '"env":"staging"' <<<"$out"
      - name: Blog editor is behind the gateway on loopback only, never on the LAN listener (SCRUM-34)
        run: |
          # The LAN listener refuses the editor's paths.
          for path in /keystatic /keystatic/ /api/keystatic/github/login; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8088$path")"
            [ "$code" = 404 ] || { echo "::error::LAN listener answers $path with $code (expected 404)"; exit 1; }
          done
          # The loopback listener (Tailscale Serve's target) serves the editor ...
          # (Keystatic's page has no <html> tag; its app bundle is called keystatic-page.)
          page="$(curl -fsS http://127.0.0.1:8089/keystatic || true)"
          if ! grep -q 'keystatic-page' <<<"$page"; then
            echo "::error::the editor isn't served on 127.0.0.1:8089/keystatic"; exit 1
          fi
          headers="$(curl -fsSI http://127.0.0.1:8089/keystatic)"
          grep -qi '^x-robots-tag: noindex' <<<"$headers" || { echo "::error::editor pages aren't noindex"; exit 1; }
          if grep -qi '^server:' <<<"$headers"; then echo "::error::editor listener leaks a Server header"; exit 1; fi
          # ... and GitHub sign-in returns to the Tailscale HTTPS address the GitHub App expects.
          login="$(curl -s -o /dev/null -D - http://127.0.0.1:8089/api/keystatic/github/login)"
          want='redirect_uri=https%3A%2F%2Fhome-server.tail8bc7ae.ts.net%3A8444%2Fapi%2Fkeystatic%2Fgithub%2Foauth%2Fcallback'
          grep -qi "^location: https://github.com/login/oauth/authorize?client_id=Iv1.citestclient&$want" <<<"$login" || {
            echo "::error::sign-in doesn't return to the Tailscale address: $(grep -i '^location' <<<"$login" | tr -d '\r')"; exit 1; }
          # Nothing on the LAN interface: the port isn't bound to 0.0.0.0.
          if ss -ltnH 'sport = :8089' | grep -qv '127.0.0.1:8089'; then
            echo "::error::port 8089 is listening beyond loopback: $(ss -ltnH 'sport = :8089')"; exit 1
          fi
      - name: That build's own smoke tests pass against the stack (SCRUM-17)
        run: |
          rev=$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' ghcr.io/thehunfromoz/picklemypaddle-site:staging)
          smoke=ghcr.io/thehunfromoz/picklemypaddle-site-smoke:$rev
          if ! err="$(docker pull -q "$smoke" 2>&1)"; then
            # Tell "package private" apart from "this commit's tag was never published".
            level=error
            repo=thehunfromoz/picklemypaddle-site-smoke
            token="$(curl -fsS "https://ghcr.io/token?scope=repository:$repo:pull" | jq -r .token 2>/dev/null || true)"
            tags="$(curl -sS -H "Authorization: Bearer $token" "https://ghcr.io/v2/$repo/tags/list?n=1000" | jq -r '.tags // [] | .[]' 2>/dev/null | tail -n 5 | xargs || true)"
            if [[ -z "$token" || "$token" == null ]]; then
              echo "::$level::Can't pull $smoke anonymously ($err). The picklemypaddle-site-smoke GHCR package looks private: make it public (runbooks/staging-home-server.md, step 1)."
            else
              echo "::$level::The smoke image for site commit ${rev:0:7} was never published ($err). Tags in the package: ${tags:-none}. Check the site's 'image / Image' publish step for that commit."
            fi
            [[ "$level" == error ]] && exit 1
            exit 0
          fi
          # Failures become an annotation, so they can be read without the job log.
          # (Workflow-command titles can't contain ',' or ':' unescaped.)
          rc=0
          docker run --rm --network host --shm-size=1g --cap-drop ALL --security-opt no-new-privileges \
            -e BASE_URL=http://127.0.0.1:8088 -e EXPECT_STAGING=1 "$smoke" >/tmp/smoke.log 2>&1 || rc=$?
          cat /tmp/smoke.log
          if [ "$rc" -ne 0 ]; then
            # Every failing test and the totals first, then the first error details.
            out="$( { grep -E '^ *[0-9]+\) |^ *[0-9]+ (failed|flaky|passed|skipped)' /tmp/smoke.log || true; } | sed 's/ ─*$//')"
            out="$out"$'\n\n'"$( { grep -E 'Error|Expected|Received|expect\(|timed out' /tmp/smoke.log || true; } | head -n 20)"
            [ -n "$out" ] || out="$(tail -n 40 /tmp/smoke.log)"
            echo "::error title=smoke tests failed for site ${rev:0:7} (exit $rc)::${out//$'\n'/%0A}"
            exit 1
          fi
      - name: Logs on failure
        if: failure()
        run: |
          out="$(docker ps -a --format '{{.Names}} {{.Status}}'; docker compose -f staging/compose.staging.yml --project-directory staging logs --tail 15 2>&1)"
          echo "::error title=containers::${out//$'\n'/%0A}"
