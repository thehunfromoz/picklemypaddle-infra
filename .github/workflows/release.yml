# Reusable: tag an already-tested image with a release version, without rebuilding
# (SCRUM-15; production releases use these tags later, SCRUM-20).
#
#   on:
#     push:
#       tags: ['v*.*.*']
#   jobs:
#     release:
#       uses: thehunfromoz/picklemypaddle-infra/.github/workflows/release.yml@main
#       permissions: { contents: read, packages: write }
#       with:
#         extra-repositories: ghcr.io/thehunfromoz/picklemypaddle-site-smoke   # optional
#
# Tagging commit abc… as v1.2.0 makes ghcr.io/<owner>/<repo>:v1.2.0 point at the exact
# image CI built and published from main for abc… (:abc…). If that commit was never
# published from main, the release fails instead of building something untested.
name: Release

on:
  workflow_call:
    inputs:
      extra-repositories:
        description: Other GHCR repositories (space separated) to tag the same way
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Tag release image
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag is a version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Point :${{ github.ref_name }} at :${{ github.sha }}
        env:
          EXTRA: ${{ inputs.extra-repositories }}
        run: |
          for repo in "ghcr.io/$GITHUB_REPOSITORY" $EXTRA; do
            if ! docker buildx imagetools inspect "$repo:$GITHUB_SHA" >/dev/null 2>&1; then
              echo "::error::$repo:$GITHUB_SHA doesn't exist. Only commits merged to main (and published by CI) can be released."
              exit 1
            fi
            docker buildx imagetools create -t "$repo:$GITHUB_REF_NAME" "$repo:$GITHUB_SHA"
            echo "$repo:$GITHUB_REF_NAME -> $GITHUB_SHA"
          done
