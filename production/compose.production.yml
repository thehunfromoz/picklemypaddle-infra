# PickleMyPaddle — production stack on the OVH VPS (SCRUM-19).
#
#   internet ──► :80 / :443 ──► gateway (Caddy, automatic HTTPS) ──► site
#                                                                 └──► integrations (/api/*) ──► postgres
#
#   tailnet  ──► https://pmp-prod.<tailnet>.ts.net (Tailscale Serve, :443 on the tailnet only)
#                ──► 127.0.0.1:8100 ──► gateway :8082 ──► integrations admin :8081  (order admin, SCRUM-71/72)
#   The admin listener is published on loopback ONLY, so only Tailscale Serve on this machine reaches
#   it; the gateway talks to the admin over its own internal network (pmp-production-admin), and
#   integrations believes Tailscale's identity headers only from the gateway there. The public sites
#   answer 404 for /admin. Tailscale Serve is set up by hand (runbooks/production-ovh-vps.md).
#
# www.<domain> is the canonical address; the bare domain redirects to it.
#
# ORDERS ARE OFF until Attila switches them on (SCRUM-68): integrations and postgres are in the
# "orders" profile, so nothing starts them, and the gateway answers /api/* with 503 while
# PMP_ORDERS isn't "open". Switching on is a documented step (runbooks/production-ovh-vps.md,
# "Switching orders on"), only after SCRUM-8 and the security epic SCRUM-21 are signed off.
#
# The gateway can serve more websites on this server (one file each in gateway/sites/).
# Each website lives in its own Compose project and its own private network, and the gateway
# joins that network, so websites cannot reach each other, only the gateway reaches them.
# To add one: runbooks/production-ovh-vps.md, "Adding another website".
#
# Only the gateway publishes ports. The site sits on a private Docker network.
# Unlike staging there is NO auto-update label and no timer: a person runs
# update.sh to deploy a release (vX.Y.Z), see runbooks/production-ovh-vps.md.
name: pmp-production

# Docker keeps container logs forever by default; cap them so a 40 GB disk can't fill up.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
      # The order admin's listener (SCRUM-71): loopback ONLY, for Tailscale Serve. Never 0.0.0.0.
      - "127.0.0.1:${ADMIN_LOCAL_PORT:-8100}:8082"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-picklemypaddle.com}
      ACME_EMAIL: ${ACME_EMAIL:-sales@picklemypaddle.com}
      HSTS: ${HSTS:-max-age=86400}
      # "open" sends /api/* to integrations; anything else answers 503 (SCRUM-68).
      PMP_ORDERS: ${PMP_ORDERS:-closed}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./gateway/sites:/etc/caddy/sites:ro
      # Certificates and the ACME account. Must survive restarts and re-installs:
      # Let's Encrypt limits how many certificates one name may be issued per week.
      - caddy_data:/data
    # One network per website the gateway serves (just Pickle My Paddle for now), plus the order
    # admin's private network (SCRUM-71), where its address is the only one integrations' admin trusts.
    networks:
      production: {}
      admin:
        aliases: [admin-gateway]
    read_only: true
    tmpfs: [/config]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # Plain-HTTP listener inside the container only (not published); see the Caddyfile.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/gateway-healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Deliberately no depends_on: the gateway (and its certificates) stays up while the
  # site is updated, rolled back or not yet deployed; visitors then get a plain
  # "temporarily unavailable" (503) page instead of a connection error.
  site:
    # The release comes from .env (SITE_VERSION, written by update.sh after a deploy
    # passes its checks). Empty means "no release deployed yet": nothing is pulled.
    image: ${SITE_IMAGE_REPO:-ghcr.io/thehunfromoz/picklemypaddle-site}:${SITE_VERSION:-none}
    restart: unless-stopped
    logging: *logging
    environment:
      SITE_ADDRESS: ":80"
      HSTS: ${HSTS:-max-age=86400}
      ORDER_API_ORIGIN: ""
    networks:
      production:
        # The name the gateway uses (gateway/sites/picklemypaddle.caddy). Unique on purpose,
        # because the gateway will sit on other websites' networks too.
        aliases: [pmp-site]
    read_only: true
    tmpfs: [/data, /config]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ── Orders (SCRUM-64 to 68): defined and ready, started only with COMPOSE_PROFILES=orders ──
  # Like the site, integrations runs a release tag (vX.Y.Z) only, never :staging.
  integrations:
    profiles: [orders]
    image: ${INTEGRATIONS_IMAGE_REPO:-ghcr.io/thehunfromoz/picklemypaddle-integrations}:${INTEGRATIONS_VERSION:-none}
    restart: unless-stopped
    logging: *logging
    environment:
      APP_ENV: production
      PORT: "8080"
      PUBLIC_SITE_ORIGIN: https://www.${SITE_DOMAIN:-picklemypaddle.com}
      TRUSTED_PROXIES: gateway
      # SCRUM-71/72: the order admin's own listener, reached only by the gateway over the admin network.
      # ADMIN_LOGINS (Attila's Tailscale login) goes in the root-only secrets file.
      ADMIN_PORT: "8081"
      ADMIN_TRUSTED_PROXIES: admin-gateway
      # Where Attila's new-order alert links to: the VPS's tailnet address.
      ADMIN_URL: ${ADMIN_URL:-https://pmp-prod.tail8bc7ae.ts.net}
    # Live keys only, plus DATABASE_URL; root-only, like staging's. Optional here so the stack
    # still validates before the file exists; the service itself refuses to start without it.
    env_file:
      - path: ${INTEGRATIONS_ENV_FILE:-/etc/picklemypaddle/integrations.env}
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - photos:/data/photos
    networks:
      production:
        aliases: [pmp-integrations]
      db: {}
      # SCRUM-71: the gateway reaches the admin at this name, from its admin-network address.
      admin:
        aliases: [pmp-integrations-admin]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  postgres:
    profiles: [orders]
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: pmp
      POSTGRES_DB: pmp
    env_file:
      - path: ${POSTGRES_ENV_FILE:-/etc/picklemypaddle/postgres.env}
        required: false
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [db]
    read_only: true
    tmpfs: [/var/run/postgresql, /tmp]
    shm_size: 128m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmp -d pmp -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  production:
    name: pmp-production
  # The order database's own network: internal, joined only by postgres and integrations.
  db:
    name: pmp-production-db
    internal: true
  # The order admin's network (SCRUM-71): internal, joined only by the gateway and integrations.
  admin:
    name: pmp-production-admin
    internal: true

volumes:
  caddy_data:
    name: pmp-production-caddy-data
  pgdata:
    name: pmp-production-pgdata
  photos:
    name: pmp-production-photos
