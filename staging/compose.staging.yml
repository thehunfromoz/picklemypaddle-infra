# PickleMyPaddle — staging stack on home-server (SCRUM-16).
#
#   Mac / LAN ──► http://home-server:${STAGING_PORT}  ──► gateway (Caddy) ──► site            (everything else)
#   tailnet   ──► https://home-server.<tailnet>.ts.net:8443                └──► integrations    (/api/*)
#                 (Tailscale Serve → 127.0.0.1:${STAGING_PORT}, SCRUM-38)
#
#   tailnet   ──► https://home-server.<tailnet>.ts.net:8444  ──► gateway :8081 ──► editor  (blog editor, SCRUM-34)
#                 (Tailscale Serve → 127.0.0.1:${EDITOR_LOCAL_PORT}; published on loopback ONLY,
#                  so the LAN can't reach it, and the LAN address answers 404 for /keystatic)
#
# Only the gateway publishes a port. Components sit on a private Docker network,
# so nothing else on home-server (or its other containers) can collide with them.
# Images are pulled from GHCR by update.sh; nothing here builds or runs repo code.
# update.sh keeps every service labelled com.picklemypaddle.autoupdate=true current.
name: pmp-staging

services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${STAGING_BIND:-0.0.0.0}:${STAGING_PORT:-8088}:80"
      # The blog editor's listener: loopback only, for Tailscale Serve (SCRUM-34). Never 0.0.0.0.
      - "127.0.0.1:${EDITOR_LOCAL_PORT:-8089}:8081"
    environment:
      # The Tailscale address the editor is opened at. Must match the editor image's build
      # (EDITOR_HOST/EDITOR_PORT in the site's Dockerfile.editor) and the GitHub App's callback URL.
      EDITOR_PUBLIC_HOST: ${EDITOR_PUBLIC_HOST:-home-server.tail8bc7ae.ts.net}
      EDITOR_PUBLIC_PORT: ${TAILSCALE_EDITOR_HTTPS_PORT:-8444}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      site:
        condition: service_healthy
    networks: [staging]
    read_only: true
    tmpfs: [/data, /config]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/gateway-healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  site:
    image: ${SITE_IMAGE:-ghcr.io/thehunfromoz/picklemypaddle-site:staging}
    restart: unless-stopped
    labels:
      com.picklemypaddle.autoupdate: "true"
    environment:
      SITE_ADDRESS: ":80"
      HSTS: "max-age=0"
      ORDER_API_ORIGIN: ""
    networks: [staging]
    read_only: true
    tmpfs: [/data, /config]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  integrations:
    image: ${INTEGRATIONS_IMAGE:-ghcr.io/thehunfromoz/picklemypaddle-integrations:staging}
    restart: unless-stopped
    labels:
      com.picklemypaddle.autoupdate: "true"
    # Non-secret settings are fixed here (and win over the secrets file), so staging
    # always runs as staging. API keys come only from the root-only secrets file,
    # which install.sh creates; the service refuses live Stripe keys on staging.
    environment:
      APP_ENV: staging
      PORT: "8080"
      # Every address staging is opened from (CORS); install.sh --tailscale adds the tailnet one.
      PUBLIC_SITE_ORIGIN: ${STAGING_SITE_ORIGINS:-http://home-server:8088}
    env_file:
      - path: ${INTEGRATIONS_ENV_FILE:-/etc/picklemypaddle/integrations.env}
        required: true
    networks: [staging]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Keystatic blog editor (SCRUM-34). STAGING ONLY: the production stack never has it, and the
  # public site image never contains it (it is a separate image built from the site repo's
  # Dockerfile.editor). Reached only through the gateway's loopback listener (see top).
  # Its GitHub App secrets come only from the root-only secrets file, which install.sh creates.
  editor:
    image: ${EDITOR_IMAGE:-ghcr.io/thehunfromoz/picklemypaddle-site-editor:staging}
    restart: unless-stopped
    labels:
      com.picklemypaddle.autoupdate: "true"
      # Built from the site repo, so its GitHub status needs its own name (update.sh).
      com.picklemypaddle.status-context: staging/home-server/editor
    environment:
      HOST: 0.0.0.0
      PORT: "4321"
    env_file:
      - path: ${EDITOR_ENV_FILE:-/etc/picklemypaddle/editor.env}
        required: true
    networks: [staging]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4321/keystatic"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  staging:
    name: pmp-staging
