# PickleMyPaddle — staging stack on home-server (SCRUM-16).
#
#   Mac / LAN ──► http://home-server:${STAGING_PORT}  ──► gateway (Caddy) ──► site            (everything else)
#   tailnet   ──► https://home-server.<tailnet>.ts.net:8443                └──► integrations    (/api/*)
#                 (Tailscale Serve → 127.0.0.1:${STAGING_PORT}, SCRUM-38)
#
#   tailnet   ──► https://home-server.<tailnet>.ts.net:8444  ──► gateway :8081 ──► editor  (blog editor, SCRUM-34)
#                 (Tailscale Serve → 127.0.0.1:${EDITOR_LOCAL_PORT}; published on loopback ONLY,
#                  so the LAN can't reach it, and the LAN address answers 404 for /keystatic)
#
#   tailnet   ──► https://home-server.<tailnet>.ts.net:8445  ──► gateway :8082 ──► integrations :8081  (order admin, SCRUM-71/72)
#                 (Tailscale Serve → 127.0.0.1:${ADMIN_LOCAL_PORT}; published on loopback ONLY. The gateway reaches
#                  the admin over its own internal network, pmp-staging-admin, which only the gateway and
#                  integrations join; integrations believes Tailscale's identity headers only from the gateway
#                  there. The LAN listener answers 404 for /admin.)
#
#   integrations ──► postgres   (SCRUM-64: the order database, on its own internal network that only
#                                integrations joins; no published port; data on a named volume)
#
# Only the gateway publishes a port. Components sit on a private Docker network,
# so nothing else on home-server (or its other containers) can collide with them.
# Images are pulled from GHCR by update.sh; nothing here builds or runs repo code.
# update.sh keeps every service labelled com.picklemypaddle.autoupdate=true current, and starts
# services labelled com.picklemypaddle.dependency=true (postgres) first. Postgres is pinned to a major
# version and, like the gateway, only changes when install.sh is re-run.
name: pmp-staging

services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${STAGING_BIND:-0.0.0.0}:${STAGING_PORT:-8088}:80"
      # The blog editor's listener: loopback only, for Tailscale Serve (SCRUM-34). Never 0.0.0.0.
      - "127.0.0.1:${EDITOR_LOCAL_PORT:-8101}:8081"
      # The order admin's listener (SCRUM-71): loopback only, for Tailscale Serve. Never 0.0.0.0.
      - "127.0.0.1:${ADMIN_LOCAL_PORT:-8100}:8082"
    environment:
      # The Tailscale address the editor is opened at. Must match the editor image's build
      # (EDITOR_HOST/EDITOR_PORT in the site's Dockerfile.editor) and the GitHub App's callback URL.
      EDITOR_PUBLIC_HOST: ${EDITOR_PUBLIC_HOST:-home-server.tail8bc7ae.ts.net}
      EDITOR_PUBLIC_PORT: ${TAILSCALE_EDITOR_HTTPS_PORT:-8444}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      site:
        condition: service_healthy
    networks:
      staging: {}
      # SCRUM-71: the gateway's address on this network is the only one integrations' admin trusts.
      admin:
        aliases: [admin-gateway]
    read_only: true
    tmpfs: [/data, /config]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/gateway-healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  site:
    image: ${SITE_IMAGE:-ghcr.io/thehunfromoz/picklemypaddle-site:staging}
    restart: unless-stopped
    labels:
      com.picklemypaddle.autoupdate: "true"
    environment:
      SITE_ADDRESS: ":80"
      HSTS: "max-age=0"
      ORDER_API_ORIGIN: ""
    networks: [staging]
    read_only: true
    tmpfs: [/data, /config]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  integrations:
    image: ${INTEGRATIONS_IMAGE:-ghcr.io/thehunfromoz/picklemypaddle-integrations:staging}
    restart: unless-stopped
    labels:
      com.picklemypaddle.autoupdate: "true"
    # Non-secret settings are fixed here (and win over the secrets file), so staging
    # always runs as staging. API keys come only from the root-only secrets file,
    # which install.sh creates; the service refuses live Stripe keys on staging.
    environment:
      APP_ENV: staging
      PORT: "8080"
      # Every address staging is opened from (CORS); install.sh --tailscale adds the tailnet one.
      PUBLIC_SITE_ORIGIN: ${STAGING_SITE_ORIGINS:-http://home-server:8088}
      # SCRUM-69: where status links in emails point. The tailnet address once install.sh
      # --tailscale has run, so the links work from Attila's phone anywhere.
      SITE_URL: ${STAGING_PUBLIC_URL:-http://home-server:8088}
      # SCRUM-67: X-Forwarded-For is believed only from the gateway (resolved on the network).
      TRUSTED_PROXIES: gateway
      # The smoke tests, Tailscale visitors and Attila's own tests all reach the service from the
      # same Docker bridge address, so staging raises the per-IP limit. Production never does
      # (the service refuses to start there with a relaxed limit).
      ORDER_LIMIT_PER_IP_HOUR: ${STAGING_ORDER_LIMIT_PER_IP_HOUR:-60}
      # SCRUM-71/72: the order admin's own listener, reached only by the gateway over the admin
      # network. ADMIN_LOGINS (Attila's Tailscale login) is in the secrets file: install.sh --set-admin-logins.
      ADMIN_PORT: "8081"
      ADMIN_TRUSTED_PROXIES: admin-gateway
      # Where Attila's new-order alert links to (the tailnet address of the admin).
      ADMIN_URL: https://${EDITOR_PUBLIC_HOST:-home-server.tail8bc7ae.ts.net}:${TAILSCALE_ADMIN_HTTPS_PORT:-8445}
    # DATABASE_URL (SCRUM-64) is in the secrets file; install.sh writes it.
    env_file:
      - path: ${INTEGRATIONS_ENV_FILE:-/etc/picklemypaddle/integrations.env}
        required: true
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Processed paddle photos (SCRUM-66): private, never served by the gateway or the site.
      - photos:/data/photos
    networks:
      staging: {}
      db: {}
      # SCRUM-71: the gateway reaches the admin at this name, so the connection comes from its
      # admin-network address (the only one trusted), never from the shared staging network.
      admin:
        aliases: [integrations-admin]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # The order database (SCRUM-64). One Postgres per app, never shared. Reachable only from
  # integrations (the db network is internal and nothing else joins it); no published port.
  # The password is in a root-only file that install.sh creates; integrations gets the matching
  # DATABASE_URL in its own secrets file.
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    labels:
      com.picklemypaddle.dependency: "true"
    environment:
      POSTGRES_USER: pmp
      POSTGRES_DB: pmp
    env_file:
      - path: ${POSTGRES_ENV_FILE:-/etc/picklemypaddle/postgres.env}
        required: true
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/... so the volume is mounted
      # one level up (a major upgrade then sits beside the old data instead of on top of it).
      - pgdata:/var/lib/postgresql
    networks: [db]
    read_only: true
    tmpfs: [/var/run/postgresql, /tmp]
    shm_size: 128m
    cap_drop: [ALL]
    # Only what the entrypoint needs to fix volume ownership and drop to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmp -d pmp -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Keystatic blog editor (SCRUM-34). STAGING ONLY: the production stack never has it, and the
  # public site image never contains it (it is a separate image built from the site repo's
  # Dockerfile.editor). Reached only through the gateway's loopback listener (see top).
  # Its GitHub App secrets come only from the root-only secrets file, which install.sh creates.
  editor:
    image: ${EDITOR_IMAGE:-ghcr.io/thehunfromoz/picklemypaddle-site-editor:staging}
    restart: unless-stopped
    labels:
      com.picklemypaddle.autoupdate: "true"
      # Built from the site repo, so its GitHub status needs its own name (update.sh).
      com.picklemypaddle.status-context: staging/home-server/editor
    environment:
      HOST: 0.0.0.0
      PORT: "4321"
    env_file:
      - path: ${EDITOR_ENV_FILE:-/etc/picklemypaddle/editor.env}
        required: true
    networks: [staging]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4321/keystatic"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  staging:
    name: pmp-staging
  # The database's own network: internal (no route out), joined only by postgres and integrations.
  db:
    name: pmp-staging-db
    internal: true
  # The order admin's network (SCRUM-71): internal, joined only by the gateway and integrations.
  admin:
    name: pmp-staging-admin
    internal: true

volumes:
  pgdata:
    name: pmp-staging-pgdata
  photos:
    name: pmp-staging-photos
